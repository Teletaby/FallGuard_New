<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FallGuard Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/images/fallguard-logo.svg">
    <link rel="icon" type="image/png" href="/static/images/fallguard-logo.png">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md mx-auto bg-gray-800 rounded-2xl shadow-2xl p-8">
        <div class="flex items-center justify-center gap-3 mb-6">
            <img src="/static/images/fallguard-logo.svg" alt="FallGuard Logo" class="w-12 h-12">
            <span class="text-2xl font-bold">FallGuard</span>
        </div>
        <h1 class="text-xl font-semibold text-center mb-6">Admin Login</h1>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="password" class="block text-sm font-medium mb-2">Password</label>
                <input type="password" id="password" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Enter admin password" required autofocus>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                Login
            </button>
            <p id="login-error" class="hidden text-sm text-red-400 text-center">Invalid password</p>
        </form>
        <div class="mt-6 text-center text-sm text-gray-400">
            Looking for the public landing page?
            <a href="/landing" class="text-blue-400 hover:text-blue-300">View landing</a>
        </div>
    </div>

<script>
    async function checkAdminAuth() {
        try {
            const response = await fetch('/api/admin/check');
            const data = await response.json();
            return data.authenticated === true;
        } catch (error) {
            return false;
        }
    }

    async function login(password) {
        const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        return response.ok;
    }

    async function init() {
        if (await checkAdminAuth()) {
            window.location.href = '/dashboard';
            return;
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.classList.add('hidden');

            const password = document.getElementById('password').value;
            const ok = await login(password);

            if (ok) {
                window.location.href = '/dashboard';
                return;
            }

            errorEl.textContent = 'Invalid password';
            errorEl.classList.remove('hidden');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        });
    }

    init();
</script>
</body>
</html>
